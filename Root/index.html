<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labyrinth Quest</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

.game-container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

canvas{
    background:#222;
    border:3px solid #555;
    margin-top:20px;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#45a049;
}

.task-box{
    background:#1e1e1e;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

input{
    padding:10px;
    width:80%;
    max-width:400px;
    border:none;
    border-radius:5px;
}

.feedback{
    margin-top:10px;
    font-weight:bold;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stats div{
    background:#1f1f1f;
    padding:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="game-container">

<h1>🧩 Labyrinth Quest</h1>

<div class="stats">
    <div>Level: <span id="level">1</span></div>
    <div>XP: <span id="xp">0</span></div>
</div>

<canvas id="gameCanvas" width="500" height="500"></canvas>

<div>
    <button onclick="move('up')">⬆</button><br>
    <button onclick="move('left')">⬅</button>
    <button onclick="move('down')">⬇</button>
    <button onclick="move('right')">➡</button>
</div>

<div class="task-box">

<h2 id="taskTitle">Task</h2>

<p id="taskDescription">
Reach the green square to unlock the question.
</p>

<input type="text" id="answerInput" placeholder="Type answer">

<br><br>

<button onclick="submitAnswer()">Submit</button>

<div class="feedback" id="feedback"></div>

</div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const cellSize = 50;
const mazeSize = 10;

let player = {x:0,y:0};
let exit = {x:9,y:9};

let level = 1;
let xp = 0;

const tasks = [
{
    question:"What is 5 + 7?",
    answer:"12"
},
{
    question:"What keyword creates variable in JavaScript?",
    answer:"let"
},
{
    question:"What comes after B?",
    answer:"c"
}
];

let currentTask = 0;
let waitingForAnswer = false;

function draw(){
    ctx.clearRect(0,0,500,500);

    for(let y=0;y<mazeSize;y++){
        for(let x=0;x<mazeSize;x++){
            ctx.strokeStyle="#555";
            ctx.strokeRect(
                x*cellSize,
                y*cellSize,
                cellSize,
                cellSize
            );
        }
    }

    ctx.fillStyle="green";
    ctx.fillRect(
        exit.x*cellSize,
        exit.y*cellSize,
        cellSize,
        cellSize
    );

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(
        player.x*cellSize+25,
        player.y*cellSize+25,
        15,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function move(direction){

    if(waitingForAnswer) return;

    if(direction==="up" && player.y>0) player.y--;
    if(direction==="down" && player.y<mazeSize-1) player.y++;
    if(direction==="left" && player.x>0) player.x--;
    if(direction==="right" && player.x<mazeSize-1) player.x++;

    draw();

    if(player.x===exit.x && player.y===exit.y){
        waitingForAnswer = true;

        document.getElementById("taskTitle").innerText =
            tasks[currentTask].question;

        document.getElementById("feedback").innerText =
            "Solve the task!";
    }
}

function submitAnswer(){

    if(!waitingForAnswer) return;

    const answer =
        document.getElementById("answerInput")
        .value
        .trim()
        .toLowerCase();

    if(answer===tasks[currentTask].answer.toLowerCase()){

        xp += 20;

        document.getElementById("xp").innerText = xp;

        document.getElementById("feedback").innerText =
            "✅ Correct!";

        currentTask++;

        if(currentTask>=tasks.length){

            setTimeout(()=>{
                alert("🏆 You completed Labyrinth Quest!");
                resetGame();
            },500);

            return;
        }

        level++;

        document.getElementById("level").innerText = level;

        player = {x:0,y:0};

        waitingForAnswer = false;

        document.getElementById("answerInput").value = "";

        document.getElementById("taskTitle").innerText = "Task";

        draw();

    }else{

        document.getElementById("feedback").innerText =
            "❌ Wrong answer!";
    }
}

function resetGame(){

    level = 1;
    xp = 0;
    currentTask = 0;

    document.getElementById("level").innerText = level;
    document.getElementById("xp").innerText = xp;

    player = {x:0,y:0};

    waitingForAnswer = false;

    draw();
}

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowUp") move("up");
    if(e.key==="ArrowDown") move("down");
    if(e.key==="ArrowLeft") move("left");
    if(e.key==="ArrowRight") move("right");

});

draw();
</script>

</body>
</html>
