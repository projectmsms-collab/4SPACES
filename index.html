<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth Quest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
        }

        .game-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stats-bar div {
            background: #1f1f1f;
            padding: 10px 15px;
            border-radius: 8px;
        }

        canvas {
            background: #222;
            border: 3px solid #555;
            max-width: 100%;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        .task-box {
            background: #1e1e1e;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 16px;
        }

        .feedback-area {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #4CAF50;
        }

        .error {
            color: #ff4c4c;
        }

        .info {
            color: #00bfff;
        }

        #hints-display {
            margin-top: 15px;
            text-align: left;
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .close {
            float: right;
            cursor: pointer;
            font-size: 28px;
        }

        @media (max-width: 600px) {
            button {
                width: 80px;
            }

            input {
                width: 95%;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🧩 Labyrinth Quest</h1>

    <div class="stats-bar">
        <div>Level: <span id="level-display">1</span></div>
        <div>XP: <span id="xp-display">0/100</span></div>
        <div>Tasks: <span id="tasks-display">0</span></div>
        <div>Position: <span id="position-display">0,0</span></div>
    </div>

    <canvas id="maze-canvas" width="500" height="500"></canvas>

    <div class="controls">
        <div>
            <button id="btn-up">⬆</button>
        </div>

        <div>
            <button id="btn-left">⬅</button>
            <button id="btn-down">⬇</button>
            <button id="btn-right">➡</button>
        </div>
    </div>

    <div class="task-box">

        <h2 id="task-title">Task</h2>

        <p id="task-description">
            Reach the green square then solve the challenge.
        </p>

        <div id="difficulty-badge"></div>

        <input
            type="text"
            id="task-input"
            placeholder="Type answer here"
        >

        <div style="margin-top:15px;">
            <button id="submit-btn">Submit</button>
            <button id="hint-btn">Hint</button>
        </div>

        <div id="feedback-area" class="feedback-area"></div>

        <div id="hints-display"></div>

    </div>

</div>

<!-- Achievement Modal -->
<div id="achievement-modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2 id="achievement-title"></h2>

        <p id="achievement-message"></p>

        <button id="continue-btn">
            Next Level
        </button>

    </div>

</div>

<!-- Game Over Modal -->
<div id="gameover-modal" class="modal">

    <div class="modal-content">

        <h2>🏆 Game Complete!</h2>

        <p id="gameover-message"></p>

        <div id="gameover-stats"></div>

        <button id="restart-btn">
            Restart Game
        </button>

    </div>

</div>

<!-- JavaScript Files -->
<script src="maze.js"></script>
<script src="taskManager.js"></script>
<script src="renderer.js"></script>
<script src="game.js"></script>

</body>
</html>
